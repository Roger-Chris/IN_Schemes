name: Backend validation

on:
  pull_request:
    paths:
      - 'backend/supabase/**'
      - 'backend/openapi/**'
      - 'backend/voice/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/backend-database.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'backend/supabase/**'
      - 'backend/openapi/**'
      - 'backend/voice/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx supabase start --exclude analytics
        working-directory: backend
      - run: npm run db:reset
        working-directory: backend
      - run: npm run db:test
        working-directory: backend
      - run: npm run db:lint
        working-directory: backend
      - run: npm run openapi:lint
        working-directory: backend

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s voice/tests -v
        working-directory: backend
