openapi: 3.1.0
info:
  title: IN Schemes Backend API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Administration and synchronization extension contract. These endpoints
    operations are planned contracts until their Edge Functions are implemented.
servers:
  - url: https://api.example.gov.in
    description: Placeholder production URL
  - url: http://127.0.0.1:54321/functions/v1
    description: Local Supabase Edge Functions
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service health and operational metadata.
  - name: Schemes
    description: Scheme draft creation, editing, and retrieval.
  - name: Workflow
    description: Review, publication, correction, and withdrawal transitions.
  - name: Sync
    description: Region-authorized incremental changes and recovery snapshots.
  - name: Imports
    description: Idempotent CSV and JSON bulk-import operations.
  - name: Audit
    description: Authorized append-only audit-event search.
paths:
  /v1/health:
    get:
      tags: [System]
      summary: Check service health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '4XX': { $ref: '#/components/responses/Error' }
  /v1/admin/schemes:
    get:
      tags: [Schemes]
      summary: List authorized schemes
      operationId: listSchemes
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized schemes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SchemeSummary' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Schemes]
      summary: Create a scheme draft
      operationId: createScheme
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSchemeRequest' }
      responses:
        '201':
          description: Draft scheme created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemeDraft' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/schemes/{schemeId}/draft:
    parameters:
      - $ref: '#/components/parameters/SchemeId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Schemes]
      summary: Get the current scheme draft
      operationId: getSchemeDraft
      responses:
        '200':
          description: Current editable draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemeDraft' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Schemes]
      summary: Update a scheme draft
      operationId: updateSchemeDraft
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current opaque version token
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SchemeContent' }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemeDraft' }
        '409': { $ref: '#/components/responses/Error' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/schemes/{schemeId}/submit:
    post:
      tags: [Workflow]
      summary: Submit a draft for independent review
      operationId: submitSchemeForReview
      parameters:
        - $ref: '#/components/parameters/SchemeId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/WorkflowRevision' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/revisions/{revisionId}/approve:
    post:
      tags: [Workflow]
      summary: Approve a reviewed revision
      operationId: approveRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkflowRevision' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/revisions/{revisionId}/reject:
    post:
      tags: [Workflow]
      summary: Reject a revision with a reason
      operationId: rejectRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectionRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkflowRevision' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/revisions/{revisionId}/publish:
    post:
      tags: [Workflow]
      summary: Publish an approved revision
      operationId: publishRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/WorkflowRevision' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/schemes/{schemeId}/withdraw:
    post:
      tags: [Workflow]
      summary: Withdraw a published scheme
      operationId: withdrawScheme
      parameters:
        - $ref: '#/components/parameters/SchemeId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkflowRevision' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sync/schemes:
    get:
      tags: [Sync]
      summary: Get authorized scheme changes
      operationId: getSchemeChanges
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Deterministically ordered authorized changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '410': { $ref: '#/components/responses/CursorExpired' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sync/snapshot:
    get:
      tags: [Sync]
      summary: Get an authorized recovery snapshot
      operationId: getSchemeSnapshot
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Bounded snapshot for authorized regions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/imports:
    post:
      tags: [Imports]
      summary: Create a bulk-import job
      operationId: createImport
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                mode: { type: string, enum: [all_or_nothing, valid_rows] }
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Imports]
      summary: List bulk-import jobs
      operationId: listImports
      responses:
        '200':
          description: Import jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImportJob' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/audit:
    get:
      tags: [Audit]
      summary: Search authorized audit events
      operationId: searchAudit
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized audit records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    SchemeId:
      name: schemeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 2048 }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CursorExpired:
      description: Cursor is outside the retained delta window
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: CURSOR_EXPIRED
              message: The cursor has expired; request a bounded snapshot.
              request_id: 019c0000-0000-7000-8000-000000000001
              retryable: false
              recovery_url: /v1/sync/snapshot
    WorkflowRevision:
      description: Workflow transition completed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SchemeDraft' }
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, format: uuid }
            retryable: { type: boolean }
            field: { type: string }
            recovery_url: { type: string }
    SchemeSummary:
      type: object
      required: [id, status, official_title]
      properties:
        id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        revision_number: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [draft, in_review, approved, rejected, published, withdrawn, archived]
        official_title: { type: string }
        short_title: { type: string }
    CreateSchemeRequest:
      allOf:
        - $ref: '#/components/schemas/SchemeContent'
        - type: object
          required: [organization_id, department_id]
          properties:
            organization_id: { type: string, format: uuid }
            department_id: { type: string, format: uuid }
    SchemeContent:
      type: object
      properties:
        official_title: { type: string, minLength: 2, maxLength: 300 }
        short_title: { type: string, minLength: 2, maxLength: 120 }
        formal_description: { type: string }
        display_summary: { type: string }
        spoken_title_ta: { type: string }
        spoken_summary_ta: { type: string }
        benefits: { type: array, items: { type: string } }
        eligibility_display_text: { type: string }
        eligibility_spoken_text: { type: string }
        eligibility_rules: { type: object, additionalProperties: true }
        application_steps: { type: array, items: { type: string } }
        official_links: { type: array, items: { type: string, format: uri } }
        effective_date: { type: string, format: date }
        expiry_date: { type: [string, 'null'], format: date }
        region_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    SchemeDraft:
      allOf:
        - $ref: '#/components/schemas/SchemeSummary'
        - $ref: '#/components/schemas/SchemeContent'
        - type: object
          required: [version_token, created_by]
          properties:
            version_token: { type: string }
            created_by: { type: string, format: uuid }
    ReviewRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 4000 }
    RejectionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 4000 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 4000 }
    SyncChange:
      type: object
      required: [sequence, operation, entity, id, revision]
      properties:
        sequence: { type: integer, minimum: 1 }
        operation: { type: string, enum: [upsert, delete] }
        entity: { type: string, const: scheme }
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        payload: { type: object }
    SyncResponse:
      type: object
      required: [schema_version, generated_at, changes, next_cursor, has_more]
      properties:
        schema_version: { type: integer, const: 1 }
        generated_at: { type: string, format: date-time }
        changes:
          type: array
          items: { $ref: '#/components/schemas/SyncChange' }
        next_cursor: { type: string }
        has_more: { type: boolean }
    ImportJob:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [validating, failed, importing, completed] }
        created_at: { type: string, format: date-time }
        total_rows: { type: integer, minimum: 0 }
        created_rows: { type: integer, minimum: 0 }
        failed_rows: { type: integer, minimum: 0 }
    AuditEvent:
      type: object
      required: [id, action, target_type, target_id, request_id, created_at]
      properties:
        id: { type: integer, minimum: 1 }
        actor_user_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        request_id: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
